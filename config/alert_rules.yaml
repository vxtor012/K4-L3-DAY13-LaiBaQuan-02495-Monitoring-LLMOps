alerts:
  - name: HighResponseLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: LaiBaQuan-02495
    runbook: docs/alerts.md#alert-1
  - name: HighAPIErrorRate
    severity: critical
    condition: 'error_rate_pct > 2'
    duration: 3m
    type: symptom-based
    channel: slack
    owner: LaiBaQuan-02495
    runbook: docs/alerts.md#alert-2
  - name: DegradedAnswerQuality
    severity: warning
    condition: 'mean(quality_score) < 0.75 or tool_success_rate_pct < 90'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: LaiBaQuan-02495
    runbook: docs/alerts.md#alert-3

